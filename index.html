<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Manager — Next-Gen Esports Arena</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #04070e;
      --bg-card: rgba(13, 20, 36, 0.75);
      --bg-card-hover: rgba(19, 30, 54, 0.9);
      --border-dim: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 240, 255, 0.35);

      --neon-primary: #00f0ff;
      --neon-primary-glow: rgba(0, 240, 255, 0.35);
      --neon-secondary: #ff0055;
      --neon-secondary-glow: rgba(255, 0, 85, 0.35);
      --neon-accent: #00ff9d;
      --neon-accent-glow: rgba(0, 255, 157, 0.35);
      --neon-gold: #ffb800;
      --neon-gold-glow: rgba(255, 184, 0, 0.35);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-main: 'Outfit', sans-serif;
      --font-gaming: 'Rajdhani', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --header-height: 76px;
    }

    [data-theme="bloodline"] {
      --neon-primary: #ff1e56;
      --neon-primary-glow: rgba(255, 30, 86, 0.35);
      --neon-secondary: #ffac41;
      --neon-secondary-glow: rgba(255, 172, 65, 0.35);
      --border-glow: rgba(255, 30, 86, 0.35);
    }
    [data-theme="matrix"] {
      --neon-primary: #00ff88;
      --neon-primary-glow: rgba(0, 255, 136, 0.35);
      --neon-secondary: #00d9ff;
      --neon-secondary-glow: rgba(0, 217, 255, 0.35);
      --border-glow: rgba(0, 255, 136, 0.35);
    }
    [data-theme="amethyst"] {
      --neon-primary: #a855f7;
      --neon-primary-glow: rgba(168, 85, 247, 0.35);
      --neon-secondary: #06b6d4;
      --neon-secondary-glow: rgba(6, 182, 212, 0.35);
      --border-glow: rgba(168, 85, 247, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-deep);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #cinematic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      display: block;
    }

    header, main, footer, .wizard-modal-overlay, .toast-container, #app-root, #navbar-container, #wizard-container, #modal-container, #search-modal-container, #notif-drawer-container {
      position: relative;
      z-index: 1;
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neon-primary); }

    .container { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
    .gaming-title { font-family: var(--font-gaming); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800; }
    .gradient-text { background: linear-gradient(135deg, #00f0ff 0%, #38bdf8 30%, #ec4899 75%, #ff0055 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gradient-accent { background: linear-gradient(135deg, #00ff9d 0%, #00f0ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .glass-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 25px -5px var(--neon-primary-glow);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--font-gaming); font-size: 15px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.07em; padding: 11px 24px; border-radius: 8px; border: 1px solid transparent;
      cursor: pointer; transition: all 0.22s ease; text-decoration: none; white-space: nowrap; position: relative; overflow: hidden;
    }
    .btn-primary { background: linear-gradient(135deg, var(--neon-primary) 0%, #0284c7 100%); color: #04070e; font-weight: 900; box-shadow: 0 0 20px var(--neon-primary-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 240, 255, 0.65); }
    .btn-accent { background: linear-gradient(135deg, var(--neon-accent) 0%, #059669 100%); color: #04070e; font-weight: 900; box-shadow: 0 0 20px var(--neon-accent-glow); }
    .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 255, 157, 0.65); }
    .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #fff; border-color: rgba(255, 255, 255, 0.12); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 1px solid var(--neon-primary); color: var(--neon-primary); }
    .btn-outline:hover { background: rgba(0, 240, 255, 0.12); box-shadow: 0 0 20px var(--neon-primary-glow); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .btn-danger:hover { background: #ef4444; color: #fff; box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
    .btn-sm { padding: 7px 16px; font-size: 13px; border-radius: var(--radius-sm); }
    .btn-lg { padding: 15px 34px; font-size: 17px; border-radius: var(--radius-md); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 9999px;
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-gaming);
    }
    .status-open { background: rgba(0, 255, 157, 0.12); border: 1px solid rgba(0, 255, 157, 0.5); color: #00ff9d; box-shadow: 0 0 12px rgba(0, 255, 157, 0.2); }
    .status-soon { background: rgba(255, 184, 0, 0.12); border: 1px solid rgba(255, 184, 0, 0.5); color: #ffb800; box-shadow: 0 0 12px rgba(255, 184, 0, 0.2); }
    .status-live { background: rgba(255, 0, 85, 0.16); border: 1px solid rgba(255, 0, 85, 0.6); color: #ff3377; box-shadow: 0 0 16px rgba(255, 0, 85, 0.35); animation: cyber-pulse 2s infinite ease-in-out; }
    .status-completed { background: rgba(100, 116, 139, 0.15); border: 1px solid rgba(100, 116, 139, 0.35); color: #94a3b8; }
    @keyframes cyber-pulse {
      0%, 100% { box-shadow: 0 0 12px rgba(255, 0, 85, 0.3); border-color: rgba(255, 0, 85, 0.6); }
      50% { box-shadow: 0 0 24px rgba(255, 0, 85, 0.7); border-color: #ff0055; }
    }
    .dot-live { width: 9px; height: 9px; background-color: #ff0055; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #ff0055; animation: blink 1s infinite alternate; }
    @keyframes blink { 0% { opacity: 0.3; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1.15); } }

    /* Navbar */
    .navbar {
      position: sticky; top: 0; height: var(--header-height); background: rgba(5, 8, 17, 0.9);
      backdrop-filter: blur(24px); border-bottom: 1px solid var(--border-dim); z-index: 100; display: flex; align-items: center;
    }
    .nav-container { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-icon {
      width: 42px; height: 42px; background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary)); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; color: #04070e; font-weight: 900; font-size: 22px;
      box-shadow: 0 0 20px var(--neon-primary-glow); transform: rotate(-3deg);
    }
    .brand-title { font-family: var(--font-gaming); font-size: 24px; font-weight: 900; color: #fff; text-transform: uppercase; }
    .brand-tagline-sub { font-size: 11px; color: var(--neon-primary); letter-spacing: 0.16em; text-transform: uppercase; display: block; font-family: var(--font-mono); }
    .nav-links { display: flex; align-items: center; gap: 22px; list-style: none; }
    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 700; text-transform: uppercase; font-family: var(--font-gaming); transition: color 0.15s ease; position: relative; padding: 8px 4px; }
    .nav-link:hover, .nav-link.active { color: #ffffff; }
    .nav-link.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--neon-primary); box-shadow: 0 0 12px var(--neon-primary); }
    .nav-actions { display: flex; align-items: center; gap: 12px; }

    .theme-picker-pill { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-dim); padding: 4px 10px; border-radius: 9999px; }
    .theme-select { background: transparent; border: none; color: #fff; font-family: var(--font-gaming); font-weight: 700; font-size: 12px; cursor: pointer; outline: none; }
    .theme-select option { background: #090e1a; color: #fff; }

    .role-switcher-badge { display: flex; align-items: center; gap: 6px; background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.3); padding: 4px 12px; border-radius: 9999px; }
    .role-select { background: transparent; border: none; color: var(--neon-primary); font-family: var(--font-gaming); font-weight: 800; font-size: 13px; cursor: pointer; outline: none; text-transform: uppercase; }
    .role-select option { background: #090e1a; color: #fff; }

    .icon-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-dim); color: var(--text-muted); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: all 0.2s ease; }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .notification-count { position: absolute; top: -4px; right: -4px; background: var(--neon-secondary); color: #fff; font-size: 10px; font-weight: 900; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px var(--neon-secondary); }
    .user-pill { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 6px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-dim); border-radius: 9999px; text-decoration: none; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon-primary); }
    .user-name { font-size: 13px; font-weight: 700; color: #fff; font-family: var(--font-gaming); }

    /* Hero */
    .hero-section { position: relative; padding: 80px 0 60px; }
    .hero-arena-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; align-items: center; }
    .hero-badge-cyber { display: inline-flex; align-items: center; gap: 10px; background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.4); padding: 6px 16px; border-radius: 9999px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; color: var(--neon-primary); margin-bottom: 24px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.15); }
    .hero-headline { font-size: clamp(42px, 5.5vw, 76px); font-family: var(--font-gaming); font-weight: 900; line-height: 1.02; text-transform: uppercase; margin-bottom: 22px; }
    .hero-sub { font-size: clamp(16px, 1.8vw, 19px); color: var(--text-muted); line-height: 1.7; max-width: 620px; margin-bottom: 36px; }

    .featured-match-hud {
      background: linear-gradient(135deg, rgba(16, 25, 46, 0.85) 0%, rgba(9, 14, 26, 0.95) 100%);
      border: 1px solid rgba(0, 240, 255, 0.35); border-radius: var(--radius-xl); padding: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 240, 255, 0.15); position: relative;
    }
    .featured-match-hud::before {
      content: 'MATCH OF THE DAY'; position: absolute; top: 14px; right: 20px; font-family: var(--font-mono);
      font-size: 10px; color: var(--neon-gold); letter-spacing: 0.15em; background: rgba(255, 184, 0, 0.12);
      padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255, 184, 0, 0.3);
    }

    .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--border-dim); }
    .stat-number { font-family: var(--font-gaming); font-size: 38px; font-weight: 900; color: #fff; }
    .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; font-family: var(--font-mono); }

    .section { padding: 60px 0; }
    .section-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
    .section-title { font-family: var(--font-gaming); font-size: 30px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
    .section-desc { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .grid-tournaments { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
    .grid-games { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }

    .tournament-card { position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: var(--radius-lg); }
    .card-banner { position: relative; height: 170px; background-size: cover; background-position: center; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .card-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 7, 14, 0.1) 0%, rgba(4, 7, 14, 0.95) 100%); }
    .card-top-badges { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .game-pill { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
    .card-content { padding: 22px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-family: var(--font-gaming); font-size: 21px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; color: #fff; }
    .card-organizer { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; font-family: var(--font-mono); }
    .card-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: var(--radius-md); margin-bottom: 18px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .metric-item { text-align: center; }
    .metric-val { font-family: var(--font-gaming); font-size: 17px; font-weight: 800; color: #fff; }
    .metric-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
    .team-progress-bar { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px; overflow: hidden; margin-bottom: 20px; }
    .team-progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon-primary), var(--neon-accent)); box-shadow: 0 0 10px var(--neon-primary); border-radius: 9999px; }
    .card-footer { margin-top: auto; display: flex; gap: 10px; }

    .game-card { position: relative; border-radius: var(--radius-md); overflow: hidden; cursor: pointer; aspect-ratio: 3/4; background-size: cover; background-position: center; border: 1px solid var(--border-dim); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); text-decoration: none; }
    .game-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(4, 7, 14, 0.95) 100%); }
    .game-card:hover { transform: translateY(-5px) scale(1.02); border-color: var(--neon-primary); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--neon-primary-glow); }
    .game-card-content { position: absolute; bottom: 14px; left: 14px; right: 14px; z-index: 2; }
    .game-name { font-family: var(--font-gaming); font-size: 19px; font-weight: 800; text-transform: uppercase; color: #fff; line-height: 1.2; }
    .game-count { font-size: 12px; color: var(--neon-primary); font-family: var(--font-mono); }

    .wizard-modal-overlay { position: fixed; inset: 0; background: rgba(3, 5, 10, 0.88); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .wizard-modal { width: 100%; max-width: 820px; max-height: 90vh; background: #090e1a; border: 1px solid rgba(0, 240, 255, 0.35); border-radius: var(--radius-xl); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 240, 255, 0.15); display: flex; flex-direction: column; overflow: hidden; }
    .wizard-header { padding: 22px 28px; border-bottom: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: space-between; }
    .wizard-steps-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: rgba(0, 0, 0, 0.4); border-bottom: 1px solid var(--border-dim); overflow-x: auto; }
    .step-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); font-family: var(--font-gaming); text-transform: uppercase; white-space: nowrap; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text-dim); }
    .step-item.active .step-num { background: var(--neon-primary); color: #04070e; border-color: var(--neon-primary); box-shadow: 0 0 15px var(--neon-primary-glow); }
    .step-item.active { color: #fff; font-weight: 800; }
    .wizard-body { padding: 28px; overflow-y: auto; flex: 1; }
    .wizard-footer { padding: 20px 28px; border-top: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.4); }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-family: var(--font-gaming); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-dim); border-radius: var(--radius-md); color: #fff; font-family: var(--font-main); font-size: 14px; outline: none; transition: all 0.2s ease; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--neon-primary); box-shadow: 0 0 0 2px var(--neon-primary-glow); background: rgba(255, 255, 255, 0.07); }
    .form-select option { background: #090e1a; color: #fff; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .filter-bar { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-dim); border-radius: var(--radius-lg); padding: 18px 22px; margin-bottom: 32px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .search-box { flex: 1; min-width: 240px; position: relative; }
    .search-input { width: 100%; padding: 11px 16px 11px 40px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-dim); border-radius: var(--radius-md); color: #fff; font-size: 14px; outline: none; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

    .tournament-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-dim); margin-bottom: 30px; overflow-x: auto; }
    .tab-btn { padding: 14px 22px; background: transparent; border: none; color: var(--text-muted); font-family: var(--font-gaming); font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; position: relative; white-space: nowrap; }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: var(--neon-primary); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: var(--neon-primary); box-shadow: 0 0 12px var(--neon-primary); }

    .match-card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: var(--radius-md); padding: 20px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 20px; transition: all 0.2s ease; }
    .match-card:hover { border-color: rgba(0, 240, 255, 0.4); background: var(--bg-card-hover); }
    .match-teams { flex: 1; display: flex; align-items: center; justify-content: center; gap: 24px; }
    .match-team { display: flex; align-items: center; gap: 12px; flex: 1; }
    .match-team.team-b { flex-direction: row-reverse; text-align: right; }
    .match-team-logo { width: 44px; height: 44px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; font-family: var(--font-gaming); font-weight: 800; font-size: 20px; color: #fff; border: 1px solid var(--border-dim); }

    // ==========================================================================
    // CINEMATIC MOVEABLE BACKGROUND ENGINE (3D CYBER GRID, PARTICLES & PARALLAX)
    // ==========================================================================
    class CinematicBackground {
      constructor(canvasId = 'cinematic-bg') {
        this.canvas = document.getElementById(canvasId);
        if (!this.canvas) {
          this.canvas = document.createElement('canvas');
          this.canvas.id = canvasId;
          document.body.prepend(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.mouse = {
          x: this.width * 0.5,
          y: this.height * 0.4,
          targetX: this.width * 0.5,
          targetY: this.height * 0.4,
          prevX: this.width * 0.5,
          prevY: this.height * 0.4,
          speed: 0,
          isHovering: false
        };

        this.camera = { x: 0, y: 0, targetX: 0, targetY: 0 };

        this.palettes = {
          cyber: {
            primary: 'rgba(0, 240, 255, ',
            secondary: 'rgba(255, 0, 85, ',
            accent: 'rgba(0, 255, 157, ',
            grid: 'rgba(0, 240, 255, ',
            horizon: 'rgba(0, 240, 255, 0.16)',
            flare1: 'rgba(0, 240, 255, 0.08)',
            flare2: 'rgba(255, 0, 85, 0.06)'
          },
          bloodline: {
            primary: 'rgba(255, 30, 86, ',
            secondary: 'rgba(255, 172, 65, ',
            accent: 'rgba(255, 87, 34, ',
            grid: 'rgba(255, 30, 86, ',
            horizon: 'rgba(255, 30, 86, 0.18)',
            flare1: 'rgba(255, 30, 86, 0.09)',
            flare2: 'rgba(255, 172, 65, 0.07)'
          },
          matrix: {
            primary: 'rgba(0, 255, 136, ',
            secondary: 'rgba(0, 217, 255, ',
            accent: 'rgba(57, 255, 20, ',
            grid: 'rgba(0, 255, 136, ',
            horizon: 'rgba(0, 255, 136, 0.15)',
            flare1: 'rgba(0, 255, 136, 0.08)',
            flare2: 'rgba(0, 217, 255, 0.06)'
          },
          amethyst: {
            primary: 'rgba(168, 85, 247, ',
            secondary: 'rgba(6, 182, 212, ',
            accent: 'rgba(236, 72, 153, ',
            grid: 'rgba(168, 85, 247, ',
            horizon: 'rgba(168, 85, 247, 0.16)',
            flare1: 'rgba(168, 85, 247, 0.09)',
            flare2: 'rgba(6, 182, 212, 0.06)'
          }
        };
        this.currentTheme = this.detectCurrentTheme();

        this.particles = [];
        this.sparkles = [];
        this.pulses = [];
        this.gridOffset = 0;
        this.lastTime = performance.now();
        this.isRunning = true;

        this.init();
      }

      detectCurrentTheme() {
        const t = document.documentElement.getAttribute('data-theme');
        return (t && this.palettes[t]) ? t : 'cyber';
      }

      init() {
        this.resize();
        this.createParticles(55);
        this.bindEvents();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.canvas.style.width = `${this.width}px`;
        this.canvas.style.height = `${this.height}px`;
        this.ctx.scale(this.dpr, this.dpr);
      }

      createParticles(count) {
        this.particles = [];
        for (let i = 0; i < count; i++) {
          this.particles.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            z: 0.15 + Math.random() * 0.85,
            baseRadius: 1 + Math.random() * 2.2,
            vx: (Math.random() - 0.5) * 0.45,
            vy: -0.2 - Math.random() * 0.55,
            colorType: Math.random() > 0.4 ? 'primary' : 'secondary',
            pulseOffset: Math.random() * Math.PI * 2,
            pulseSpeed: 0.02 + Math.random() * 0.03
          });
        }
      }

      bindEvents() {
        window.addEventListener('resize', () => this.resize(), { passive: true });

        window.addEventListener('mousemove', (e) => {
          this.mouse.targetX = e.clientX;
          this.mouse.targetY = e.clientY;
          this.mouse.isHovering = true;

          const dx = e.clientX - this.mouse.prevX;
          const dy = e.clientY - this.mouse.prevY;
          const dist = Math.hypot(dx, dy);
          this.mouse.speed = dist;
          this.mouse.prevX = e.clientX;
          this.mouse.prevY = e.clientY;

          if (dist > 7 && Math.random() > 0.35) {
            this.addSparkle(e.clientX, e.clientY);
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (e.touches && e.touches[0]) {
            this.mouse.targetX = e.touches[0].clientX;
            this.mouse.targetY = e.touches[0].clientY;
            this.mouse.isHovering = true;
          }
        }, { passive: true });

        window.addEventListener('pointerdown', (e) => {
          this.addShockwave(e.clientX, e.clientY);
        }, { passive: true });

        const observer = new MutationObserver(() => {
          this.currentTheme = this.detectCurrentTheme();
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        document.addEventListener('visibilitychange', () => {
          this.isRunning = !document.hidden;
          if (this.isRunning) {
            this.lastTime = performance.now();
            requestAnimationFrame(this.loop);
          }
        });
      }

      addSparkle(x, y) {
        if (this.sparkles.length > 25) return;
        this.sparkles.push({
          x, y,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5,
          life: 1.0,
          decay: 0.035 + Math.random() * 0.03,
          size: 1.5 + Math.random() * 2
        });
      }

      addShockwave(x, y) {
        if (this.pulses.length > 5) this.pulses.shift();
        this.pulses.push({
          x, y,
          radius: 5,
          maxRadius: Math.max(this.width, this.height) * 0.42,
          alpha: 0.75,
          speed: 7.5
        });

        this.particles.forEach(p => {
          const dx = p.x - x;
          const dy = p.y - y;
          const d = Math.hypot(dx, dy);
          if (d < 250 && d > 1) {
            const force = (1 - d / 250) * 8;
            p.vx += (dx / d) * force;
            p.vy += (dy / d) * force;
          }
        });
      }

      update(dt) {
        this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.06;
        this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.06;

        const normX = (this.mouse.x - this.width * 0.5) / (this.width * 0.5);
        const normY = (this.mouse.y - this.height * 0.5) / (this.height * 0.5);
        this.camera.targetX = normX;
        this.camera.targetY = normY;
        this.camera.x += (this.camera.targetX - this.camera.x) * 0.05;
        this.camera.y += (this.camera.targetY - this.camera.y) * 0.05;

        this.gridOffset = (this.gridOffset + 0.006) % 1;

        const mouseX = this.mouse.x;
        const mouseY = this.mouse.y;

        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          p.pulseOffset += p.pulseSpeed;

          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.985;
          if (p.vy > -0.2) p.vy -= 0.01;

          const dx = mouseX - p.x;
          const dy = mouseY - p.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 160 && dist > 1) {
            const influence = (1 - dist / 160) * 0.6 * p.z;
            p.vx += (-dy / dist) * influence * 0.8;
            p.vy += (dx / dist) * influence * 0.8;
          }

          if (p.y < -20) {
            p.y = this.height + 15;
            p.x = Math.random() * this.width;
          }
          if (p.x < -20) p.x = this.width + 15;
          if (p.x > this.width + 20) p.x = -15;
        }

        for (let i = this.sparkles.length - 1; i >= 0; i--) {
          const s = this.sparkles[i];
          s.x += s.vx;
          s.y += s.vy;
          s.life -= s.decay;
          if (s.life <= 0) this.sparkles.splice(i, 1);
        }

        for (let i = this.pulses.length - 1; i >= 0; i--) {
          const pulse = this.pulses[i];
          pulse.radius += pulse.speed;
          pulse.alpha *= 0.94;
          if (pulse.radius >= pulse.maxRadius || pulse.alpha <= 0.02) {
            this.pulses.splice(i, 1);
          }
        }
      }

      draw() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;
        const palette = this.palettes[this.currentTheme] || this.palettes.cyber;

        ctx.clearRect(0, 0, w, h);

        this.drawAtmosphere(palette);
        this.drawCyberFloor(palette);
        this.drawParticleField(palette);
        this.drawPulsesAndSparks(palette);
        this.drawVignette();
      }

      drawAtmosphere(palette) {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        const orb1X = w * 0.25 - this.camera.x * 60;
        const orb1Y = h * 0.25 - this.camera.y * 40;
        const grad1 = ctx.createRadialGradient(orb1X, orb1Y, 10, orb1X, orb1Y, w * 0.45);
        grad1.addColorStop(0, palette.flare1);
        grad1.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad1;
        ctx.fillRect(0, 0, w, h);

        const orb2X = w * 0.8 + this.camera.x * 50;
        const orb2Y = h * 0.45 + this.camera.y * 35;
        const grad2 = ctx.createRadialGradient(orb2X, orb2Y, 10, orb2X, orb2Y, w * 0.4);
        grad2.addColorStop(0, palette.flare2);
        grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad2;
        ctx.fillRect(0, 0, w, h);

        if (this.mouse.isHovering) {
          const auraGrad = ctx.createRadialGradient(this.mouse.x, this.mouse.y, 5, this.mouse.x, this.mouse.y, 220);
          auraGrad.addColorStop(0, palette.primary + '0.08)');
          auraGrad.addColorStop(0.5, palette.secondary + '0.03)');
          auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = auraGrad;
          ctx.fillRect(0, 0, w, h);
        }
      }

      drawCyberFloor(palette) {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        const horizonY = h * 0.54 + this.camera.y * 35;
        const vanishingX = w * 0.5 + this.camera.x * 90;

        const horizonGrad = ctx.createLinearGradient(0, horizonY - 15, 0, horizonY + 25);
        horizonGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        horizonGrad.addColorStop(0.5, palette.horizon);
        horizonGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = horizonGrad;
        ctx.fillRect(0, horizonY - 20, w, 40);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, horizonY, w, h - horizonY);
        ctx.clip();

        const rayCount = 18;
        const spreadWidth = w * 2.2;
        const startX = vanishingX - spreadWidth * 0.5;
        const stepX = spreadWidth / rayCount;

        ctx.lineWidth = 1;
        for (let i = 0; i <= rayCount; i++) {
          const bottomX = startX + i * stepX;
          const distRatio = Math.abs(bottomX - vanishingX) / (spreadWidth * 0.5);
          const alpha = Math.max(0.04, (1 - distRatio * 0.7) * 0.22);

          const rayGrad = ctx.createLinearGradient(vanishingX, horizonY, bottomX, h);
          rayGrad.addColorStop(0, palette.grid + '0)');
          rayGrad.addColorStop(0.3, palette.grid + (alpha * 0.5) + ')');
          rayGrad.addColorStop(1, palette.grid + alpha + ')');

          ctx.strokeStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(vanishingX, horizonY);
          ctx.lineTo(bottomX, h);
          ctx.stroke();
        }

        const lineCount = 14;
        const floorHeight = h - horizonY;

        for (let i = 0; i < lineCount; i++) {
          const progress = (i + this.gridOffset) / lineCount;
          const t = Math.pow(progress, 2.6);
          const lineY = horizonY + floorHeight * t;

          if (lineY > horizonY && lineY <= h) {
            const lineAlpha = Math.min(0.28, t * 0.32);
            ctx.strokeStyle = palette.grid + lineAlpha + ')';
            ctx.beginPath();
            ctx.moveTo(0, lineY);
            ctx.lineTo(w, lineY);
            ctx.stroke();
          }
        }

        const pulseT = Math.pow((this.gridOffset * 1.8) % 1, 2.4);
        const pulseY = horizonY + floorHeight * pulseT;
        if (pulseY > horizonY && pulseY <= h) {
          const pulseGrad = ctx.createLinearGradient(0, pulseY - 2, 0, pulseY + 2);
          pulseGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          pulseGrad.addColorStop(0.5, palette.primary + '0.45)');
          pulseGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.strokeStyle = pulseGrad;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, pulseY);
          ctx.lineTo(w, pulseY);
          ctx.stroke();
          ctx.lineWidth = 1;
        }

        ctx.restore();
      }

      drawParticleField(palette) {
        const ctx = this.ctx;
        const count = this.particles.length;

        for (let i = 0; i < count; i++) {
          const p1 = this.particles[i];
          const p1X = p1.x + this.camera.x * p1.z * 45;
          const p1Y = p1.y + this.camera.y * p1.z * 30;

          for (let j = i + 1; j < count; j++) {
            const p2 = this.particles[j];
            const p2X = p2.x + this.camera.x * p2.z * 45;
            const p2Y = p2.y + this.camera.y * p2.z * 30;

            const dist = Math.hypot(p1X - p2X, p1Y - p2Y);
            const maxDist = 95 * ((p1.z + p2.z) * 0.5);

            if (dist < maxDist) {
              const lineAlpha = (1 - dist / maxDist) * 0.16 * p1.z;
              ctx.strokeStyle = palette.primary + lineAlpha + ')';
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(p1X, p1Y);
              ctx.lineTo(p2X, p2Y);
              ctx.stroke();
            }
          }
        }

        for (let i = 0; i < count; i++) {
          const p = this.particles[i];
          const px = p.x + this.camera.x * p.z * 45;
          const py = p.y + this.camera.y * p.z * 30;

          const pulse = 1 + Math.sin(p.pulseOffset) * 0.25;
          const radius = p.baseRadius * p.z * pulse;
          const baseAlpha = (0.35 + p.z * 0.55);
          const colorPrefix = p.colorType === 'primary' ? palette.primary : palette.secondary;

          const haloGrad = ctx.createRadialGradient(px, py, radius * 0.2, px, py, radius * 3.5);
          haloGrad.addColorStop(0, colorPrefix + (baseAlpha * 0.9) + ')');
          haloGrad.addColorStop(0.5, colorPrefix + (baseAlpha * 0.3) + ')');
          haloGrad.addColorStop(1, colorPrefix + '0)');

          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(px, py, radius * 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(px, py, Math.max(0.7, radius * 0.6), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawPulsesAndSparks(palette) {
        const ctx = this.ctx;

        for (let i = 0; i < this.pulses.length; i++) {
          const pulse = this.pulses[i];
          ctx.save();
          ctx.strokeStyle = palette.primary + pulse.alpha + ')';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = palette.primary + '1)';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.arc(pulse.x, pulse.y, pulse.radius, 0, Math.PI * 2);
          ctx.stroke();

          if (pulse.radius > 25) {
            ctx.strokeStyle = palette.secondary + (pulse.alpha * 0.6) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(pulse.x, pulse.y, pulse.radius * 0.82, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        }

        for (let i = 0; i < this.sparkles.length; i++) {
          const s = this.sparkles[i];
          ctx.fillStyle = palette.accent + s.life + ')';
          ctx.shadowColor = palette.accent + '1)';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      drawVignette() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        const vignette = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.35, w * 0.5, h * 0.5, Math.max(w, h) * 0.8);
        vignette.addColorStop(0, 'rgba(4, 7, 14, 0.2)');
        vignette.addColorStop(0.7, 'rgba(4, 7, 14, 0.65)');
        vignette.addColorStop(1, 'rgba(4, 7, 14, 0.92)');

        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, w, h);
      }

      loop(timestamp) {
        if (!this.isRunning) return;
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        this.update(dt);
        this.draw();

        requestAnimationFrame(this.loop);
      }
    }

    // Initialize Moveable Cinematic Background
    const cinematicBg = new CinematicBackground('cinematic-bg');
    window.cinematicBg = cinematicBg;

    function route() {
      const hash = window.location.hash.replace('#', '') || 'home';
      const [path, id] = hash.split('/');
      renderNavbar();
      if (path === 'home') renderHome();
      else if (path === 'tournaments') renderDiscovery();
      else if (path === 'tournament-details') renderDetails(id);
      else if (path === 'live') renderLive();
      else if (path === 'dashboard') renderDashboard();
      else renderHome();
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', route);
    route();
  </script>
</body>
</html>
